name: CI - Executar testes de integracao da API
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Codigo
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Rodar Testes com Maven no perfil "test"
      run: |
        cd supergestor-api
        mvn test -Dspring.profiles.active=test