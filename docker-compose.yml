version: '3.8'

services:
  app:
    build:
      context: ./supergestor-api
      dockerfile: Dockerfile
    container_name: supergestor-app
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CORS_ALLOWED_ORIGINS=http://localhost

      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=supergestor
      - DB_USER=postgres
      - DB_PASSWORD=1234567

      - JWT_SECRET=minha_chave_123
      - JWT_EXPIRATION=2
      - JWT_ISSUER=super-gestor

      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - ADMIN_EMAIL=admin@supergestor.com.br
      - ADMIN_CPF=00000000000

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CACHE_TTL=3600

      # Logs & Management
      - MANAGEMENT_PORT=8081
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - redis

  front:
    build:
      context: ./supergestor-front
      dockerfile: Dockerfile
    container_name: supergestor-front
    ports:
      - "80:80"
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: supergestor-db
    restart: always
    environment:
      - POSTGRES_DB=supergestor
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234567
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: supergestor-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  grafana_data: