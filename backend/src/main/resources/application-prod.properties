# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lojix}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Calibrado para ate 20 usuarios administrativos)
spring.datasource.hikari.pool-name=LojixHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:12}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migration

# Seguranca
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION:2}
api.security.token.issuer=${JWT_ISSUER:super-gestor}

# Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
# management.server.port=8081
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Logs
logging.level.root=${LOG_LEVEL:INFO}
logging.file.path=
logging.file.name=

# Config do usuario admin
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nome=Administrador do Sistema
app.admin.email=${ADMIN_EMAIL}
app.admin.cpf=${ADMIN_CPF}

# Redis
spring.cache.type=redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
cache.ttl=${CACHE_TTL:3600}
spring.cache.redis.enable-keyspace-events=true

# AWS S3
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.presigned-url-expiration-minutes=${AWS_S3_URL_EXPIRATION:1440}
aws.s3.max-file-size-mb=${AWS_S3_MAX_FILE_SIZE:5}
aws.s3.timeout.api-call-seconds=10
aws.s3.timeout.api-call-attempt-seconds=5

# E-mail (SMTP)
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true