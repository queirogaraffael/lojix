# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supergestor}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migration

# Seguranca
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION:2}
api.security.token.issuer=${JWT_ISSUER:super-gestor}

# Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Logs
logging.level.root=${LOG_LEVEL:INFO}
logging.file.path=
logging.file.name=

# Config do usuario admin
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nome=Administrador do Sistema
app.admin.email=${ADMIN_EMAIL}
app.admin.cpf=${ADMIN_CPF}

# Redis
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
cache.ttl=${CACHE_TTL:3600}
spring.cache.redis.enable-keyspace-events=true
