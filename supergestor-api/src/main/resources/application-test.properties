# Swagger
springdoc.swagger-ui.path=/swagger
springdoc.enable-hateoas=false

# H2 - Ambiente de Teste
spring.h2.console.enabled=false
spring.datasource.url=jdbc:h2:mem:hotel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Security
api.security.token.secret=test-secret
api.security.token.expiration=1
api.security.token.issuer=test-issuer
api.security.refresh.expiration=5

# Admin default para testes
app.admin.username=admin
app.admin.password=admin
app.admin.nome=Administrador Teste
app.admin.email=admin@test.com
app.admin.cpf=00000000000

spring.flyway.enabled=false

spring.cache.type=simple
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration